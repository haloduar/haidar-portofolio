<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haidar — Portfolio</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #090909;
  --card-bg: #141414;
  --text: #F0EBE1;
  --muted: #7A7570;
  --accent: #E8531A;
  --border: #252525;
  --card-w: 280px;
  --card-h: 400px;
}

html { scroll-behavior: smooth; }
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: 'Helvetica Neue', Arial, sans-serif;
  overflow-x: hidden;
}

/* ── BACKGROUND LAYER ── */
#bg-layer {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: var(--bg);
  transition: opacity 0.6s;
}
#bg-layer img, #bg-layer video {
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0.35;
}
#bg-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(9,9,9,0.5) 0%, rgba(9,9,9,0.7) 60%, rgba(9,9,9,0.95) 100%);
}

/* ── SETTINGS PANEL ── */
#settings-btn {
  position: fixed;
  top: 20px; right: 20px;
  z-index: 1000;
  width: 36px; height: 36px;
  background: rgba(20,20,20,0.85);
  border: 1px solid var(--border);
  border-radius: 50%;
  color: var(--muted);
  cursor: pointer;
  font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(10px);
  transition: color 0.2s, background 0.2s;
}
#settings-btn:hover { color: var(--text); background: rgba(40,40,40,0.9); }

#settings-panel {
  position: fixed;
  top: 64px; right: 20px;
  z-index: 1000;
  background: rgba(16,16,16,0.96);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  width: 280px;
  backdrop-filter: blur(20px);
  display: none;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
#settings-panel.open { display: block; }

.settings-label {
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
  display: block;
}
.settings-input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  color: var(--text);
  font-size: 12px;
  margin-bottom: 10px;
  outline: none;
}
.settings-input:focus { border-color: var(--accent); }
.settings-apply {
  width: 100%;
  padding: 9px;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.05em;
  margin-bottom: 12px;
}
.settings-apply:hover { background: #ff6530; }
.settings-divider {
  height: 1px;
  background: var(--border);
  margin: 12px 0;
}
.settings-hint {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.5;
  font-style: italic;
}
.settings-radio-row {
  display: flex; gap: 8px; margin-bottom: 10px;
}
.settings-radio {
  flex: 1;
  padding: 7px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--muted);
  font-size: 11px;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
}
.settings-radio.active { border-color: var(--accent); color: var(--accent); background: rgba(232,83,26,0.08); }

/* ── HOME ── */
#home {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  padding-bottom: 80px;
  transition: opacity 0.45s, transform 0.45s;
}
#home.exit { opacity: 0; transform: scale(0.97); pointer-events: none; }

.hero-section {
  padding: 100px 24px 48px;
  text-align: center;
}
.eyebrow {
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 14px;
  font-weight: 600;
}
.hero-name {
  font-size: clamp(40px, 7vw, 76px);
  font-weight: 900;
  line-height: 1.0;
  letter-spacing: -0.03em;
  margin-bottom: 12px;
}
.hero-sub {
  font-family: Georgia, serif;
  font-size: clamp(14px, 1.8vw, 18px);
  color: var(--muted);
  font-style: italic;
}

/* ── CAROUSEL ── */
.carousel-section {
  position: relative;
  padding: 20px 0 60px;
  overflow: visible;
}

/* Arrow buttons */
.carousel-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 10;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: rgba(20,20,20,0.85);
  border: 1px solid var(--border);
  color: var(--text);
  cursor: pointer;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(10px);
  transition: background 0.2s, opacity 0.2s;
}
.carousel-arrow:hover { background: rgba(232,83,26,0.3); border-color: var(--accent); }
.carousel-arrow.hidden { opacity: 0; pointer-events: none; }
#arrow-left { left: 16px; }
#arrow-right { right: 16px; }

/* Track */
.carousel-viewport {
  overflow: hidden;
  padding: 40px 0;
  cursor: grab;
  user-select: none;
}
.carousel-viewport:active { cursor: grabbing; }

.carousel-track {
  display: flex;
  align-items: center;
  gap: 24px;
  transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
  will-change: transform;
}

/* perspective container for each card */
.card-scene {
  flex-shrink: 0;
  perspective: 1000px;
  width: var(--card-w);
  height: var(--card-h);
  transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
}

.card-wrap {
  width: 100%; height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
}

/* default tilt for non-center cards */
.card-scene.tilt-left .card-wrap  { transform: rotateY(14deg) scale(0.9); }
.card-scene.tilt-right .card-wrap { transform: rotateY(-14deg) scale(0.9); }
.card-scene.far-left .card-wrap   { transform: rotateY(22deg) scale(0.78) translateZ(-40px); }
.card-scene.far-right .card-wrap  { transform: rotateY(-22deg) scale(0.78) translateZ(-40px); }
/* center card */
.card-scene.center .card-wrap     { transform: rotateY(0deg) scale(1); }
/* center hover */
.card-scene.center:hover .card-wrap { transform: rotateY(0deg) scale(1.04) translateY(-8px); }
/* adjacent hover */
.card-scene.tilt-left:hover .card-wrap  { transform: rotateY(6deg) scale(0.96) translateY(-4px); }
.card-scene.tilt-right:hover .card-wrap { transform: rotateY(-6deg) scale(0.96) translateY(-4px); }

/* opacity dimming */
.card-scene.tilt-left,
.card-scene.tilt-right  { opacity: 0.75; }
.card-scene.far-left,
.card-scene.far-right   { opacity: 0.4; }
.card-scene.center      { opacity: 1; }

.card {
  width: 100%; height: 100%;
  background: var(--card-bg);
  border-radius: 20px;
  border: 1px solid var(--border);
  cursor: pointer;
  overflow: hidden;
  position: relative;
  box-shadow: 0 24px 60px rgba(0,0,0,0.55), inset 0 0 0 0.5px rgba(255,255,255,0.04);
  transition: box-shadow 0.4s;
}
.card:hover { box-shadow: 0 36px 80px rgba(0,0,0,0.65); }

.card-visual {
  height: 210px;
  position: relative;
  overflow: hidden;
}
.card-visual-graphic {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 70px;
  position: relative;
}
.graphic-bg { position: absolute; inset: 0; }
.card-visual-graphic .icon { position: relative; z-index: 1; filter: drop-shadow(0 6px 20px rgba(0,0,0,0.5)); }

/* Card GD */
.card-gd .graphic-bg { background: linear-gradient(135deg,#1a0a00,#2d1200,#0a0a14); }
.brush { position: absolute; inset: 0; }
.brush span { position: absolute; border-radius: 50%; mix-blend-mode: screen; }
.brush span:nth-child(1) { width:160px;height:160px; background:radial-gradient(circle,rgba(232,83,26,.3),transparent 70%); top:-20px;right:10px; }
.brush span:nth-child(2) { width:100px;height:100px; background:radial-gradient(circle,rgba(255,160,50,.25),transparent 70%); bottom:20px;left:20px; }
.brush span:nth-child(3) { width:80px;height:80px; background:radial-gradient(circle,rgba(200,50,200,.2),transparent 70%); top:50px;left:50px; }

/* Card AUTO */
.card-auto .graphic-bg { background: linear-gradient(135deg,#000d1a,#001428,#0a0a0a); }
.grid-pat {
  position: absolute; inset: 0; opacity: .13;
  background-image: linear-gradient(rgba(56,150,232,.4) 1px,transparent 1px), linear-gradient(90deg,rgba(56,150,232,.4) 1px,transparent 1px);
  background-size: 28px 28px;
}

.card-body { padding: 20px; }
.card-tag { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 8px; }
.card-title { font-size: 20px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; margin-bottom: 8px; }
.card-desc { font-family: Georgia,serif; font-size: 12px; color: var(--muted); line-height: 1.6; font-style: italic; }

.card-cta {
  position: absolute; bottom: 16px; right: 16px;
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  transition: transform .3s, background .3s;
}
.card:hover .card-cta { transform: scale(1.12); }

/* Dots */
.carousel-dots {
  display: flex; justify-content: center; gap: 6px;
  margin-top: 8px;
}
.dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--border);
  transition: background .3s, transform .3s;
}
.dot.active { background: var(--accent); transform: scale(1.4); }

/* Scroll hint */
.scroll-hint {
  text-align: center;
  padding: 40px 24px 20px;
  color: var(--muted);
  font-size: 12px;
  letter-spacing: .1em;
  opacity: .5;
}

/* ── INNER PAGE ── */
#inner-page {
  position: fixed; inset: 0; z-index: 200;
  background: var(--bg);
  display: none; flex-direction: column;
  opacity: 0; transform: translateY(24px);
  transition: opacity .4s cubic-bezier(.23,1,.32,1), transform .4s cubic-bezier(.23,1,.32,1);
  overflow: hidden;
}
#inner-page.visible { display: flex; opacity: 1; transform: translateY(0); }

.back-btn {
  position: absolute; top: 20px; left: 20px;
  display: flex; align-items: center; gap: 7px;
  background: rgba(255,255,255,.06); border: 1px solid var(--border);
  border-radius: 999px; padding: 8px 16px;
  font-size: 13px; color: var(--muted); cursor: pointer; z-index: 10;
  transition: background .2s, color .2s;
}
.back-btn:hover { background: rgba(255,255,255,.1); color: var(--text); }

.inner-hero { padding: 72px 40px 24px; text-align: center; flex-shrink: 0; }
.inner-eyebrow { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.inner-title { font-size: clamp(26px,4vw,46px); font-weight: 900; letter-spacing: -.03em; margin-bottom: 5px; }
.inner-sub { font-family: Georgia,serif; font-size: 13px; color: var(--muted); font-style: italic; }

.tab-bar {
  display: flex; justify-content: center; gap: 4px;
  margin: 16px auto 22px;
  background: rgba(18,18,18,.9);
  border: 1px solid var(--border); border-radius: 999px;
  padding: 5px; width: fit-content; max-width: 90vw;
  backdrop-filter: blur(20px); flex-shrink: 0; flex-wrap: wrap;
}
.tab-btn {
  padding: 6px 16px; border-radius: 999px; border: none;
  background: transparent; color: var(--muted);
  font-size: 12px; font-weight: 600; letter-spacing: .04em;
  cursor: pointer; transition: background .22s, color .22s; white-space: nowrap;
}
.tab-btn.active { background: var(--accent); color: white; }
.tab-btn:hover:not(.active) { background: rgba(255,255,255,.07); color: var(--text); }

.gallery-area { flex: 1; overflow-y: auto; padding: 0 28px 40px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(180px,1fr)); gap: 14px; max-width: 880px; margin: 0 auto; }

.gallery-item {
  border-radius: 14px; overflow: hidden; cursor: pointer;
  position: relative; aspect-ratio: 3/4;
  background: var(--card-bg); border: 1px solid var(--border);
  transition: transform .3s, box-shadow .3s;
}
.gallery-item:hover { transform: translateY(-4px); box-shadow: 0 18px 48px rgba(0,0,0,.5); }
.gallery-thumb {
  width: 100%; height: 70%;
  display: flex; align-items: center; justify-content: center; font-size: 44px;
}
.gallery-info { padding: 10px 12px; }
.gallery-info h4 { font-size: 12px; font-weight: 700; margin-bottom: 3px; }
.gallery-info p { font-size: 10px; color: var(--muted); font-family: Georgia,serif; font-style: italic; }
.gallery-overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,.5);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .22s; border-radius: 14px; font-size: 22px;
}
.gallery-item:hover .gallery-overlay { opacity: 1; }

/* ── MODAL ── */
#modal-overlay {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,.8); backdrop-filter: blur(12px);
  display: none; align-items: center; justify-content: center; padding: 20px;
}
#modal-overlay.open { display: flex; }
.modal {
  background: #111; border: 1px solid var(--border); border-radius: 22px;
  width: min(500px,100%); max-height: 88vh; overflow: hidden;
  position: relative; display: flex; flex-direction: column;
}
.modal-visual {
  height: 200px; display: flex; align-items: center; justify-content: center;
  font-size: 68px; flex-shrink: 0; position: relative; overflow: hidden;
}
.modal-body { padding: 22px; overflow-y: auto; flex: 1; }
.modal-tag { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin-bottom: 5px; }
.modal-title { font-size: 22px; font-weight: 900; letter-spacing: -.02em; margin-bottom: 10px; }
.modal-desc { font-family: Georgia,serif; font-size: 13px; color: #aaa; line-height: 1.7; font-style: italic; margin-bottom: 18px; }
.modal-tags { display: flex; flex-wrap: wrap; gap: 7px; }
.modal-chip {
  padding: 4px 12px; background: rgba(255,255,255,.05);
  border: 1px solid var(--border); border-radius: 999px;
  font-size: 10px; color: var(--muted);
}
.modal-nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 22px 18px; flex-shrink: 0; border-top: 1px solid var(--border);
}
.nav-btn {
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(255,255,255,.06); border: 1px solid var(--border);
  color: var(--text); cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 13px;
  transition: background .2s;
}
.nav-btn:hover { background: var(--accent); border-color: var(--accent); }
.nav-btn:disabled { opacity: .3; cursor: default; }
.modal-counter { font-size: 12px; color: var(--muted); }
.modal-close {
  position: absolute; top: 12px; right: 12px;
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.1);
  color: white; cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center; z-index: 10;
  transition: background .2s;
}
.modal-close:hover { background: rgba(255,255,255,.15); }

/* Node dots */
.node-dots { position: absolute; inset: 0; }
.node-dot { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: rgba(56,150,232,.55); box-shadow: 0 0 7px rgba(56,150,232,.8); }
.node-line { position: absolute; height: 1px; background: linear-gradient(90deg,transparent,rgba(56,150,232,.28),transparent); transform-origin: left center; }
</style>
</head>
<body>

<!-- BG LAYER -->
<div id="bg-layer">
  <div id="bg-overlay"></div>
</div>

<!-- SETTINGS -->
<button id="settings-btn" onclick="toggleSettings()">⚙</button>
<div id="settings-panel">
  <span class="settings-label">Background type</span>
  <div class="settings-radio-row">
    <div class="settings-radio active" id="radio-color" onclick="setBgType('color')">Color</div>
    <div class="settings-radio" id="radio-image" onclick="setBgType('image')">Image</div>
    <div class="settings-radio" id="radio-video" onclick="setBgType('video')">Video</div>
  </div>

  <div id="bg-color-row">
    <span class="settings-label">Background color</span>
    <input class="settings-input" id="bg-color-input" type="color" value="#090909" style="height:38px; padding:4px 8px; cursor:pointer;">
  </div>
  <div id="bg-url-row" style="display:none;">
    <span class="settings-label">URL gambar / video</span>
    <input class="settings-input" id="bg-url-input" placeholder="https://..." />
  </div>

  <button class="settings-apply" onclick="applyBg()">Apply</button>

  <div class="settings-divider"></div>
  <p class="settings-hint">Paste URL gambar (jpg/png/webp) atau video (mp4/webm). Video akan di-loop otomatis dan muted.</p>
</div>

<!-- HOME -->
<div id="home">
  <div class="hero-section">
    <p class="eyebrow">Creative &amp; Visioner</p>
    <h1 class="hero-name">Hi, I'm Haidar.</h1>
    <p class="hero-sub">Designer, builder, storyteller — here's what I've made.</p>
  </div>

  <!-- CAROUSEL -->
  <div class="carousel-section">
    <button class="carousel-arrow" id="arrow-left" onclick="shiftCarousel(-1)">←</button>
    <button class="carousel-arrow hidden" id="arrow-right" onclick="shiftCarousel(1)">→</button>

    <div class="carousel-viewport" id="carousel-viewport">
      <div class="carousel-track" id="carousel-track">
        <!-- Cards injected by JS -->
      </div>
    </div>

    <div class="carousel-dots" id="carousel-dots"></div>
  </div>

  <div class="scroll-hint">↓ scroll to explore</div>

  <!-- extra scroll space -->
  <div style="height: 200px; display:flex; align-items:center; justify-content:center; opacity:0.12; font-size:13px; letter-spacing:.1em; text-transform:uppercase;">More coming soon</div>
</div>

<!-- INNER PAGE -->
<div id="inner-page">
  <button class="back-btn" onclick="closeInner()">← Back</button>
  <div class="inner-hero">
    <p class="inner-eyebrow" id="inner-eyebrow"></p>
    <h2 class="inner-title" id="inner-title"></h2>
    <p class="inner-sub" id="inner-sub"></p>
  </div>
  <div class="tab-bar" id="tab-bar"></div>
  <div class="gallery-area"><div class="gallery-grid" id="gallery-grid"></div></div>
</div>

<!-- MODAL -->
<div id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-visual" id="modal-visual"></div>
    <div class="modal-body">
      <p class="modal-tag" id="modal-tag"></p>
      <h3 class="modal-title" id="modal-title"></h3>
      <p class="modal-desc" id="modal-desc"></p>
      <div class="modal-tags" id="modal-tags"></div>
    </div>
    <div class="modal-nav">
      <button class="nav-btn" id="nav-prev" onclick="slideModal(-1)">←</button>
      <span class="modal-counter" id="modal-counter"></span>
      <button class="nav-btn" id="nav-next" onclick="slideModal(1)">→</button>
    </div>
  </div>
</div>

<script>
/* ─── DATA ─── */

  {
    id: 'gd',

        { icon:'🌿', bg:'linear-gradient(135deg,#050f05,#0d2010)', title:'Herbal Brand Logo', desc:'Minimal wordmark for an organic wellness brand targeting millennial audiences.', tags:['Logo','Brand Identity'] },

        { icon:'✍️', bg:'linear-gradient(135deg,#0f0800,#2a1a00)', title:'Editorial Cover', desc:'Magazine-style cover layout for a creative writing collection.', tags:['Print','Editorial'] },

    }

  auto: {
    eyebrow: 'Technical Work',

/* ─── CAROUSEL ─── */
let currentIndex = 0;
const CARD_W = 280;
const GAP = 24;

function buildCarousel() {
  const track = document.getElementById('carousel-track');
  const dots = document.getElementById('carousel-dots');
  track.innerHTML = '';
  dots.innerHTML = '';

  // padding so first/last card can be centered
  const padEl = () => { const d = document.createElement('div'); d.style.flexShrink='0'; return d; };

  CARDS.forEach((c, i) => {
    const scene = document.createElement('div');
    scene.className = 'card-scene';
    scene.id = 'scene-' + i;

    const wrap = document.createElement('div');
    wrap.className = 'card-wrap';

    const card = document.createElement('div');
    card.className = 'card card-' + c.visualType;

    // visual
    let visualHTML = '';
    if (c.visualType === 'gd') {
      visualHTML = `<div class="card-visual">
        <div class="graphic-bg"></div>
        <div class="brush"><span></span><span></span><span></span></div>
        <div class="card-visual-graphic"><span class="icon">${c.icon}</span></div>
      </div>`;
    } else {
      visualHTML = `<div class="card-visual">
        <div class="graphic-bg"></div>
        <div class="grid-pat"></div>
        <div class="node-dots" id="nd-${i}"></div>
        <div class="card-visual-graphic"><span class="icon">${c.icon}</span></div>
      </div>`;
    }

    card.innerHTML = `
      ${visualHTML}
      <div class="card-body">
        <span class="card-tag">${c.tag}</span>
        <h2 class="card-title">${c.title.replace('\n','<br>')}</h2>
        <p class="card-desc">${c.desc}</p>
      </div>
      <div class="card-cta" style="background:${c.ctaBg}">→</div>
    `;
    card.onclick = () => { if(i === currentIndex) openInner(c.id); else goTo(i); };

    wrap.appendChild(card);
    scene.appendChild(wrap);
    track.appendChild(scene);

    // dot
    const dot = document.createElement('div');
    dot.className = 'dot' + (i===0?' active':'');
    dot.onclick = () => goTo(i);
    dots.appendChild(dot);
  });

  drawAllNodes();
  applyCarouselState();
}

function goTo(idx) {
  currentIndex = Math.max(0, Math.min(CARDS.length - 1, idx));
  applyCarouselState();
}

function shiftCarousel(dir) { goTo(currentIndex + dir); }

function applyCarouselState() {
  const track = document.getElementById('carousel-track');
  const vp = document.getElementById('carousel-viewport');
  const vpW = vp.offsetWidth;

  // offset: center current card
  const offset = vpW / 2 - (currentIndex * (CARD_W + GAP)) - CARD_W / 2;
  track.style.transform = `translateX(${offset}px)`;

  // classes
  CARDS.forEach((_, i) => {
    const scene = document.getElementById('scene-' + i);
    const diff = i - currentIndex;
    scene.className = 'card-scene';
    if (diff === 0)       scene.classList.add('center');
    else if (diff === -1) scene.classList.add('tilt-left');
    else if (diff === 1)  scene.classList.add('tilt-right');
    else if (diff < -1)   scene.classList.add('far-left');
    else                  scene.classList.add('far-right');
  });

  // dots
  document.querySelectorAll('.dot').forEach((d,i) => {
    d.classList.toggle('active', i === currentIndex);
  });

  // arrows
  document.getElementById('arrow-left').classList.toggle('hidden', currentIndex === 0);
  document.getElementById('arrow-right').classList.toggle('hidden', currentIndex === CARDS.length - 1);
}

// drag / swipe
(function() {
  const vp = document.getElementById('carousel-viewport');
  let startX = 0, isDragging = false, moved = false;
  vp.addEventListener('mousedown', e => { startX = e.clientX; isDragging = true; moved = false; });
  window.addEventListener('mousemove', e => { if (!isDragging) return; if (Math.abs(e.clientX - startX) > 5) moved = true; });
  window.addEventListener('mouseup', e => {
    if (!isDragging) return; isDragging = false;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 50) shiftCarousel(dx < 0 ? 1 : -1);
  });
  vp.addEventListener('touchstart', e => { startX = e.touches[0].clientX; moved = false; }, {passive:true});
  vp.addEventListener('touchmove', e => { if (Math.abs(e.touches[0].clientX - startX) > 5) moved = true; }, {passive:true});
  vp.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 50) shiftCarousel(dx < 0 ? 1 : -1);
  });
  window.addEventListener('resize', () => applyCarouselState());
})();

function drawAllNodes() {
  CARDS.forEach((c, i) => {
    if (c.visualType !== 'auto') return;
    const container = document.getElementById('nd-' + i);
    if (!container) return;
    const positions = [[15,35],[50,25],[90,48],[130,30],[170,44],[210,25],[35,72],[75,62],[115,78],[155,64],[195,74],[25,108],[65,100],[105,118],[145,106],[185,116]];
    positions.forEach(([x,y]) => {
      const dot = document.createElement('div');
      dot.className = 'node-dot';
      dot.style.cssText = `left:${x}px;top:${y}px`;
      container.appendChild(dot);
    });
    for (let j=0;j<positions.length-1;j++) {
      if (Math.random()>.45) {
        const [x1,y1]=positions[j],[x2,y2]=positions[j+1];
        const len=Math.hypot(x2-x1,y2-y1),angle=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
        const line=document.createElement('div');
        line.className='node-line';
        line.style.cssText=`left:${x1}px;top:${y1}px;width:${len}px;transform:rotate(${angle}deg)`;
        container.appendChild(line);
      }
    }
  });
}

/* ─── BG SETTINGS ─── */
let bgType = 'color';

function toggleSettings() {
  document.getElementById('settings-panel').classList.toggle('open');
}
document.addEventListener('click', e => {
  if (!e.target.closest('#settings-panel') && !e.target.closest('#settings-btn')) {
    document.getElementById('settings-panel').classList.remove('open');
  }
});

function setBgType(t) {
  bgType = t;
  ['color','image','video'].forEach(x => {
    document.getElementById('radio-'+x).classList.toggle('active', x===t);
  });
  document.getElementById('bg-color-row').style.display = t==='color' ? '' : 'none';
  document.getElementById('bg-url-row').style.display  = t!=='color' ? '' : 'none';
}

function applyBg() {
  const layer = document.getElementById('bg-layer');
  // remove old media
  layer.querySelectorAll('img,video').forEach(el => el.remove());

  if (bgType === 'color') {
    const col = document.getElementById('bg-color-input').value;
    document.body.style.background = col;
    document.documentElement.style.setProperty('--bg', col);
    layer.style.background = col;
  } else {
    const url = document.getElementById('bg-url-input').value.trim();
    if (!url) return;
    if (bgType === 'image') {
      const img = document.createElement('img');
      img.src = url; img.alt = '';
      layer.insertBefore(img, layer.querySelector('#bg-overlay'));
    } else {
      const vid = document.createElement('video');
      vid.src = url; vid.autoplay = true; vid.loop = true; vid.muted = true; vid.playsInline = true;
      layer.insertBefore(vid, layer.querySelector('#bg-overlay'));
    }
  }
  document.getElementById('settings-panel').classList.remove('open');
}

/* ─── INNER PAGE ─── */
let currentSection = null, currentItems = [], modalIndex = 0;

function openInner(section) {
  currentSection = section;
  const d = DATA[section];
  document.getElementById('inner-eyebrow').textContent = d.eyebrow;
  document.getElementById('inner-title').textContent = d.title;
  document.getElementById('inner-sub').textContent = d.sub;

  const tabBar = document.getElementById('tab-bar');
  tabBar.innerHTML = '';
  d.tabs.forEach((t,i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn'+(i===0?' active':'');
    btn.textContent = t;
    btn.onclick = () => switchTab(t, btn);
    tabBar.appendChild(btn);
  });

  renderGallery(d.items['All']);

  document.getElementById('home').classList.add('exit');
  const inner = document.getElementById('inner-page');
  inner.style.display = 'flex';
  requestAnimationFrame(() => requestAnimationFrame(() => inner.classList.add('visible')));
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const items = DATA[currentSection].items[tab] || DATA[currentSection].items['All'];
  renderGallery(items);
}

function renderGallery(items) {
  currentItems = items;
  const grid = document.getElementById('gallery-grid');
  grid.innerHTML = '';
  items.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'gallery-item';
    el.innerHTML = `
      <div class="gallery-thumb" style="background:${item.bg}">
        <span style="font-size:42px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))">${item.icon}</span>
      </div>
      <div class="gallery-info"><h4>${item.title}</h4><p>${item.tags[0]}</p></div>
      <div class="gallery-overlay">👁</div>`;
    el.onclick = () => openModal(i);
    grid.appendChild(el);
  });
}

function openModal(idx) { modalIndex = idx; renderModal(); document.getElementById('modal-overlay').classList.add('open'); }

function renderModal() {
  const item = currentItems[modalIndex];
  const d = DATA[currentSection];
  document.getElementById('modal-visual').style.background = item.bg;
  document.getElementById('modal-visual').innerHTML = `<span style="font-size:68px;filter:drop-shadow(0 8px 24px rgba(0,0,0,.6))">${item.icon}</span>`;
  document.getElementById('modal-tag').textContent = d.eyebrow.toUpperCase();
  document.getElementById('modal-title').textContent = item.title;
  document.getElementById('modal-desc').textContent = item.desc;
  document.getElementById('modal-tags').innerHTML = item.tags.map(t=>`<span class="modal-chip">${t}</span>`).join('');
  document.getElementById('modal-counter').textContent = `${modalIndex+1} / ${currentItems.length}`;
  document.getElementById('nav-prev').disabled = modalIndex === 0;
  document.getElementById('nav-next').disabled = modalIndex === currentItems.length-1;
}

function slideModal(dir) { const n=modalIndex+dir; if(n<0||n>=currentItems.length)return; modalIndex=n; renderModal(); }
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function handleOverlayClick(e) { if(e.target===document.getElementById('modal-overlay'))closeModal(); }

function closeInner() {
  document.getElementById('inner-page').classList.remove('visible');
  document.getElementById('home').classList.remove('exit');
  setTimeout(() => { document.getElementById('inner-page').style.display='none'; }, 420);
}

document.addEventListener('keydown', e => {
  if (e.key==='Escape') {
    if(document.getElementById('modal-overlay').classList.contains('open')) closeModal();
    else if(currentSection) closeInner();
  }
  if(document.getElementById('modal-overlay').classList.contains('open')) {
    if(e.key==='ArrowRight') slideModal(1);
    if(e.key==='ArrowLeft')  slideModal(-1);
  }
  if(e.key==='ArrowRight' && !document.getElementById('modal-overlay').classList.contains('open') && document.getElementById('home').style.display!=='none') shiftCarousel(1);
  if(e.key==='ArrowLeft'  && !document.getElementById('modal-overlay').classList.contains('open') && document.getElementById('home').style.display!=='none') shiftCarousel(-1);
});

/* ─── INIT ─── */
buildCarousel();
</script>
